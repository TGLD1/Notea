name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pas de wrapper Gradle committé dans le repo : cette action installe
      # directement la version de Gradle demandée (avec cache).
      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: notea-debug-apk
          path: app/build/outputs/apk/debug/*.apk
