name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pas de wrapper Gradle committé dans le repo : cette action installe
      # directement la version de Gradle demandée (avec cache).
      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Vérifier la clé KkiaPay
        env:
          KKIAPAY_PUBLIC_KEY: ${{ secrets.KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY }}
        run: |
          if [ -z "$KKIAPAY_PUBLIC_KEY" ]; then
            echo "::warning::Clé KkiaPay ABSENTE : créer le secret KKIAPAY_PUBLIC_KEY (Settings > Secrets and variables > Actions > Secrets)."
          else
            echo "::notice::Clé KkiaPay transmise (${#KKIAPAY_PUBLIC_KEY} caractères)."
          fi

      - name: Vérifier la clé FedaPay
        env:
          FEDAPAY_PUBLIC_KEY: ${{ secrets.FEDAPAY_SANDBOX_PUBLIC_KEY || secrets.FEDAPAY_PUBLIC_KEY || vars.FEDAPAY_PUBLIC_KEY }}
        run: |
          if [ -z "$FEDAPAY_PUBLIC_KEY" ]; then
            echo "::warning::Clé FedaPay ABSENTE : créer le secret FEDAPAY_PUBLIC_KEY (clé publique live) et, pour les tests, FEDAPAY_SANDBOX_PUBLIC_KEY (clé publique sandbox)."
          else
            case "$FEDAPAY_PUBLIC_KEY" in
              sk_*) echo "::error::Le secret FedaPay contient une clé SECRÈTE (sk_). Mets la clé PUBLIQUE (pk_)." ; exit 1 ;;
              pk_live_*) echo "::notice::Clé FedaPay LIVE transmise : les dons du APK debug seront de vrais paiements." ;;
              *) echo "::notice::Clé FedaPay sandbox transmise (paiements de test)." ;;
            esac
          fi

      - name: Tests unitaires
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon
        env:
          KKIAPAY_PUBLIC_KEY: ${{ secrets.KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY }}
          KKIAPAY_SANDBOX: ${{ vars.KKIAPAY_SANDBOX }}
          FEDAPAY_PUBLIC_KEY: ${{ secrets.FEDAPAY_SANDBOX_PUBLIC_KEY || secrets.FEDAPAY_PUBLIC_KEY || vars.FEDAPAY_PUBLIC_KEY }}

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: notea-enseignant-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier les schémas Room
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
