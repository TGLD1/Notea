name: Release signée

# Lancement manuel : Actions > Release signée > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version affiché (ex. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Numéro de version (entier, à augmenter à chaque publication)"
        required: true
        default: "1"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Secret GitHub manquant : $variable (Settings > Secrets and variables > Actions > Secrets)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notea-release.jks"

      - name: Construire l'APK et l'AAB signés
        run: gradle assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/notea-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KKIAPAY_PUBLIC_KEY: ${{ secrets.KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY }}
          KKIAPAY_SANDBOX: ${{ vars.KKIAPAY_SANDBOX }}

      - name: Vérifier le poids de l'APK (limite : 50 Mo)
        run: |
          taille=$(stat -c %s app/build/outputs/apk/release/*.apk)
          echo "Poids de l'APK : $((taille / 1024 / 1024)) Mo"
          if [ "$taille" -gt 52428800 ]; then
            echo "::error::L'APK dépasse 50 Mo."
            exit 1
          fi

      - name: Publier l'APK signé
        uses: actions/upload-artifact@v4
        with:
          name: notea-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier l'AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: notea-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publier le fichier de correspondance R8
        uses: actions/upload-artifact@v4
        with:
          name: notea-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
