name: Release signée

# Se lance à chaque push sur master, ou à la main (Actions > Release signée > Run workflow).
# Sur un push, le numéro de version est le numéro d'exécution du workflow (toujours croissant),
# le nom de version est 1.0.0 sauf indication contraire lors d'un lancement manuel.
on:
  push:
    branches: [master, main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version affiché (ex. 1.0.1)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Numéro de version (entier croissant) ; vide = numéro d'exécution"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Secret GitHub manquant : $variable (Settings > Secrets and variables > Actions > Secrets)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notea-release.p12"
          if ! keytool -list -keystore "$RUNNER_TEMP/notea-release.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Impossible d'ouvrir le keystore : vérifier KEYSTORE_BASE64, KEYSTORE_PASSWORD et KEY_ALIAS (nom exact de la clé)."
            exit 1
          fi

      - name: Construire l'APK et l'AAB signés
        run: gradle assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/notea-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          KKIAPAY_PUBLIC_KEY: ${{ secrets.KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY }}
          KKIAPAY_SANDBOX: ${{ vars.KKIAPAY_SANDBOX }}

      - name: Vérifier le poids de l'APK (limite : 50 Mo)
        run: |
          taille=$(stat -c %s app/build/outputs/apk/release/*.apk)
          echo "Poids de l'APK : $((taille / 1024 / 1024)) Mo"
          if [ "$taille" -gt 52428800 ]; then
            echo "::error::L'APK dépasse 50 Mo."
            exit 1
          fi

      - name: Publier l'APK signé
        uses: actions/upload-artifact@v4
        with:
          name: notea-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier l'AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: notea-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publier le fichier de correspondance R8
        uses: actions/upload-artifact@v4
        with:
          name: notea-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
