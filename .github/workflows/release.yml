name: Release signée

# - Push sur master : construit l'APK et l'AAB signés (artifacts).
# - Push d'une étiquette « v1.0.0 » : construit, puis PUBLIE l'APK dans les Releases GitHub.
# - Lancement manuel : au choix, avec publication (case « publier »).
on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "site-apps/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version affiché (ex. 1.0.1)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Numéro de version (entier croissant) ; vide = numéro d'exécution"
        required: false
        default: ""
      publier:
        description: "Publier l'APK dans les Releases GitHub"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déterminer la version
        id: version
        env:
          INPUT_NAME: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NOM="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_NAME" ]; then
            NOM="$INPUT_NAME"
          else
            NOM="1.0.0"
          fi
          CODE="${INPUT_CODE:-$GITHUB_RUN_NUMBER}"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NOM (code $CODE)"

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Secret GitHub manquant : $variable (Settings > Secrets and variables > Actions > Secrets)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notea-release.p12"
          if ! keytool -list -keystore "$RUNNER_TEMP/notea-release.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Impossible d'ouvrir le keystore : vérifier KEYSTORE_BASE64, KEYSTORE_PASSWORD et KEY_ALIAS (nom exact de la clé)."
            exit 1
          fi

      - name: Construire l'APK et l'AAB signés
        run: gradle assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/notea-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.nom }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KKIAPAY_PUBLIC_KEY: ${{ secrets.KKIAPAY_PUBLIC_KEY || vars.KKIAPAY_PUBLIC_KEY }}
          KKIAPAY_SANDBOX: ${{ vars.KKIAPAY_SANDBOX }}
          FEDAPAY_PUBLIC_KEY: ${{ secrets.FEDAPAY_PUBLIC_KEY || vars.FEDAPAY_PUBLIC_KEY }}

      - name: "Vérifier le poids de l'APK (limite de 50 Mo)"
        run: |
          taille=$(stat -c %s app/build/outputs/apk/release/*.apk)
          echo "Poids de l'APK : $((taille / 1024 / 1024)) Mo"
          if [ "$taille" -gt 52428800 ]; then
            echo "::error::L'APK dépasse 50 Mo."
            exit 1
          fi

      - name: Préparer les fichiers à distribuer
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Notea.apk
          cp dist/Notea.apk "dist/Notea-${{ steps.version.outputs.nom }}.apk"
          (cd dist && sha256sum Notea.apk > Notea.apk.sha256)
          cat dist/Notea.apk.sha256

      - name: Publier l'APK signé (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: notea-release-apk
          path: dist/*

      - name: Publier l'AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: notea-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publier le fichier de correspondance R8
        uses: actions/upload-artifact@v4
        with:
          name: notea-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publier dans les Releases GitHub
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publier == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOM: ${{ steps.version.outputs.nom }}
        run: |
          ETIQUETTE="v$NOM"
          FICHIERS=(dist/Notea.apk "dist/Notea-$NOM.apk" dist/Notea.apk.sha256)
          if gh release view "$ETIQUETTE" > /dev/null 2>&1; then
            gh release upload "$ETIQUETTE" "${FICHIERS[@]}" --clobber
          else
            gh release create "$ETIQUETTE" "${FICHIERS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Notea $NOM" \
              --notes "Notea $NOM — application de suivi scolaire FASTEK. Téléchargez Notea.apk, puis ouvrez-le sur votre téléphone Android (7 ou plus). La somme de contrôle SHA-256 est fournie dans Notea.apk.sha256." \
              --latest
          fi
          echo "Release publiée : https://github.com/${{ github.repository }}/releases/tag/$ETIQUETTE"
